# Single source of truth for lint, format and type checks (same split as phoebus-display-mcp).
# The hooks delegate to the uv-managed tools pinned exactly in uv.lock, so versions and config
# are identical to the dev and CI runs. CI calls `pre-commit run --all-files`. The scope comes
# from pyproject.toml ([tool.ruff] select / per-file-ignores, [tool.mypy] files).
#
# CHOSEN DIRECTION for GB-83, argued here rather than merely configured:
# Until 2026-08-09 all three hooks carried `pass_filenames: false`, so their tools walked the
# WORKING TREE. A single untracked file belonging to a parallel window therefore blocked EVERY
# commit in the repository, including commits that did not touch it. That happened twice, and the
# second time it was mutual: two windows held each other, each recording the other as the cause,
# so waiting was not a way out. CI never had the problem, because it runs on a clean checkout.
# The local gate was, in other words, stricter than CI at a place unrelated to the commit.
#
# The fix differs per tool, because the tools differ:
#
#   ruff -> `pass_filenames: true`. Every rule family selected here is PER FILE exact; ruff has no
#   cross-file analysis, and pre-commit stashes unstaged changes to tracked files anyway. Nothing
#   is lost, and a foreign untracked file can no longer reach these hooks at all. `--force-exclude`
#   is mandatory, not decoration: without it ruff checks a file handed to it even when the
#   configuration excludes it (measured).
#
#   mypy -> stays repository-wide, but runs over the materialised INDEX instead of the working
#   tree (`scripts/mypy_on_index.py`). mypy analyses across modules, so a subset of files would be
#   a real loss of coverage; the index is constructively the set CI checks out.
#
# REJECTED, and measured rather than assumed: subtracting the untracked files with `--exclude`.
# mypy's `--exclude` is an UNANCHORED regular expression and ruff's exclude without a slash is a
# BASENAME glob, so excluding an untracked `utils.py` also silences a tracked `src/utils.py` and
# the gate reports success on staged, broken code. On top of that `ruff format` has no
# `--extend-exclude` at all. That route would not have been stricter, it would have been silently
# blind. Cost and the rest of the reasoning: the module header of the script.
#
# TWO STAGES, TWO SHIMS, AND THEY DO NOT COMPETE. The six hooks below run at the default
# `pre-commit` stage over FILES; `commit-message` runs at the `commit-msg` stage over the MESSAGE,
# which is a leak surface no file guard can reach (GB-33). pre-commit installs a SEPARATE
# .git/hooks/commit-msg shim for it, so nothing about the existing pre-commit shim changes, and
# `core.hooksPath` (which would switch the framework off in this repository) is not involved. The
# work item assumed the opposite; measured on pre-commit 4.6.0, the two shims are independent files.
#
# ⚠️ `default_install_hook_types` decides what `pre-commit install` WIRES, not what is wired now.
# A fresh clone runs the message guard only after `uv run pre-commit install --hook-type commit-msg`
# (or a plain `pre-commit install`, which now honours the list below). CI is unaffected either way:
# `pre-commit run --all-files` drives the pre-commit stage only, which is why the message guard's
# behaviour is pinned by tests/test_commit_message_guard.py instead.
#
# ⚠️ `default_stages` is NOT decoration here, and this was measured rather than reasoned about. A
# hook that names no stage runs at EVERY stage, so merely installing the commit-msg shim made the
# six file hooks run a second time, over `.git/COMMIT_EDITMSG`. The first live commit attempt
# printed them twice and proved it. Two of them do not belong on that surface: `typography` and
# `language` police the tracked TREE, and an em dash or a German word in a commit subject is a
# style question, not a leak, so blocking a commit over one would be a change nobody argued for.
# Pinning the default to `pre-commit` keeps each hook on the surface it was written for; the
# message guard names its own stage below.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        pass_filenames: true
        require_serial: true
      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
        pass_filenames: true
        require_serial: true
      - id: mypy
        name: mypy --strict (over the git index)
        entry: uv run python scripts/mypy_on_index.py
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: no-ess-internal
        name: no ESS-internal / PII / secrets
        entry: uv run python scripts/check_no_ess_internal.py
        language: system
        pass_filenames: true
        require_serial: true
      # Typography: em/en dashes, ellipses, curly quotes and the doubled hyphen. Ruff cannot do
      # this job: of the NINE characters this guard forbids it recognises THREE (the en dash,
      # U+2018 and U+201A), probed one at a time through RUF001-003 on 2026-08-15, and it would
      # only ever see .py anyway.
      # ⚠ Do not read that three against the "five of the nine" in CLAUDE.md and known-limits:
      # that five counts the OTHER nine, the old allowed-confusables list, whose typographic
      # apostrophe and multiplication sign this guard deliberately allows. Two sets, two numbers;
      # naming the set is what keeps them apart.
      - id: typography
        name: no typographic punctuation
        entry: uv run python scripts/check_typography.py
        language: system
        pass_filenames: true
        require_serial: true
      # Language: this repository is written in English. Three independent signals, because the
      # umlaut grep that once cleared the tree missed 87 of its 156 German lines (measured on the
      # pre-translation tree, db5a83c) and reported nothing about the miss.
      - id: language
        name: English only
        entry: uv run python scripts/check_language.py
        language: system
        pass_filenames: true
        require_serial: true
      # The commit MESSAGE, scanned with the guards that already exist: the secret/site patterns
      # from check_no_ess_internal and the structural device-PV detector shared with test_guide.
      # `always_run` because the file pre-commit hands a commit-msg hook is `.git/COMMIT_EDITMSG`,
      # which carries no extension and would fall outside any `types` filter.
      - id: commit-message
        name: no secrets / site identifiers / device names in the commit message
        entry: uv run python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
        require_serial: true
