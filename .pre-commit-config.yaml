# Single source of truth for lint, format and type checks (same split as phoebus-display-mcp).
# The hooks delegate to the uv-managed tools pinned exactly in uv.lock, so versions and config
# are identical to the dev and CI runs. CI calls `pre-commit run --all-files`. The scope comes
# from pyproject.toml ([tool.ruff] select / per-file-ignores, [tool.mypy] files).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check src tests scripts
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check src tests scripts
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: no-ess-internal
        name: no ESS-internal / PII / secrets
        entry: uv run python scripts/check_no_ess_internal.py
        language: system
        pass_filenames: true
        require_serial: true
      # Typography: em/en dashes, ellipses, curly quotes and the doubled hyphen. Ruff cannot do
      # this job (it recognises only the en dash of that set, measured; see pyproject's
      # allowed-confusables comment), and it would only ever see .py anyway.
      - id: typography
        name: no typographic punctuation
        entry: uv run python scripts/check_typography.py
        language: system
        pass_filenames: true
        require_serial: true
      # Language: this repository is written in English. Three independent signals, because the
      # umlaut grep that once cleared the tree missed 87 of its 156 German lines (measured on the
      # pre-translation tree, db5a83c) and reported nothing about the miss.
      - id: language
        name: English only
        entry: uv run python scripts/check_language.py
        language: system
        pass_filenames: true
        require_serial: true
