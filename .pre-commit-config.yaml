# Single source of truth for lint, format and type checks (same split as phoebus-display-mcp).
# The hooks delegate to the uv-managed tools pinned exactly in uv.lock, so versions and config
# are identical to the dev and CI runs. CI calls `pre-commit run --all-files`. The scope comes
# from pyproject.toml ([tool.ruff] select / per-file-ignores, [tool.mypy] files).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check src tests scripts
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check src tests scripts
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: no-ess-internal
        name: no ESS-internal / PII / secrets
        entry: uv run python scripts/check_no_ess_internal.py
        language: system
        pass_filenames: true
        require_serial: true
