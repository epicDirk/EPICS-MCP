name: Publish

# Two triggers, and the difference between them is the point.
#
#   * A version tag (`v0.3.0`) is the real release. It is the only path that uploads.
#   * A manual run is a REHEARSAL and defaults to a dry run: it builds, gates and keeps the
#     artifacts, and stops before the upload. That is what makes this workflow testable before
#     anyone has a package-index account, rather than testable only by releasing.
#
# The upload itself uses Trusted Publishing (OIDC): the index verifies this repository, this
# workflow file and this environment, so no API token is ever stored here. That needs a one-off
# setup on the index side, described in CONTRIBUTING.md under "Releasing".
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only, do not upload"
        type: boolean
        default: true

# Default to nothing. Each job asks for exactly what it needs, so the OIDC token that can publish
# exists in one job and nowhere else.
permissions: {}

jobs:
  # Build and judge. No credentials of any kind reach this job, which is why it also runs on a
  # rehearsal: the expensive half of a release is finding out that the artifact was wrong.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # v7, not the newest release: setup-uv publishes v8.x and v9.x, but has NOT published a
      # floating `v8` or `v9` major tag (measured, both fail to resolve), so `@v9` would break this
      # workflow outright. v7 is the newest major that resolves AND runs on node24.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      # CI already runs on the tag push, but nothing makes THIS workflow wait for it, and a release
      # built from a red tree is exactly the artifact that must not exist. Two minutes here buys
      # that guarantee inside the workflow that does the uploading.
      # --locked rather than --frozen: both install from the lockfile, only --locked verifies that
      # it still matches pyproject.toml. This is the job that UPLOADS, so a dependency edit whose
      # `uv lock` was forgotten must stop here rather than ship an artifact built against a
      # dependency set the project file no longer declares (GB-33 c; same change in ci.yml).
      - name: Install dependencies (exactly as uv.lock pins them)
        run: uv sync --extra dev --locked
      # The other half of the same argument, and it was missing. The step below replicated ci.yml's
      # `test` job into the workflow that uploads, for the reason the comment above gives, while
      # ci.yml's `lint` job stayed behind: the release built and shipped without ruff, without
      # ruff-format, without mypy --strict and, the one that decides the severity, without
      # scripts/check_no_ess_internal.py, the only thing in this repository that scans the tree for
      # a credential at all, and `src/` ships in the wheel while `docs/` ships in the sdist. What it
      # scans FOR is narrower on a runner than locally, and that is worth knowing rather than
      # assuming: its site-specific patterns are loaded from a git-ignored file that no checkout
      # materialises, so a fresh runner runs the built-in credential formats only. Those are the
      # ones that matter here. CI would go red on the same tag
      # push, but this workflow neither waits for it nor can be blocked by it (main carries no
      # branch protection and no ruleset), and a package index never lets a version be reused: a
      # secret published this way can only be superseded, never withdrawn.
      - name: Lint, format and types (the same pre-commit chain ci.yml runs)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Run tests
        run: uv run pytest tests/ --tb=short

      # `uv build` does NOT clear dist/, and a stale artifact is uploaded just as happily as a
      # fresh one. Measured on a developer checkout: a three-week-old 0.2.0 wheel was still there,
      # carrying a direct reference that the current build no longer has.
      - name: Clear any previous artifacts
        run: rm -rf dist

      - name: Build sdist and wheel
        run: uv build

      # The gate reads the BUILT metadata: a direct reference (rejected by the index), a
      # pre-release version published by accident (a version number burned for good), or a
      # description that would not render on the project page. Two shapes of the same gate
      # (QA-2 + QA-16):
      #
      #   * A REHEARSAL runs between releases and must not care what the working version happens
      #     to be, so it tolerates a pre-release one. ⚠️ It does NOT follow that the working
      #     version IS a .dev one, and this comment used to say so: measured, the declared version
      #     simply stays at the last release until the next bump, and only two commits in this
      #     repository's history ever carried a .dev version at all. The flag is the safety valve
      #     that keeps the rehearsal green either way, not a description of the tree.
      #   * A TAG run stays strict AND pins the tag to the built version: the build uses whatever
      #     pyproject.toml says, so a tag pushed against an unbumped tree would otherwise publish
      #     the wrong version under that tag, and an index never lets either number be reused.
      #     This branch runs on a tag ALONE, so no rehearsal has ever exercised it.
      - name: Release gate (rehearsal, tolerates a pre-release working version)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: uv run python scripts/check_release_ready.py --allow-prerelease dist/*
      - name: Release gate (tag, strict, and the tag must match the built version)
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python scripts/check_release_ready.py --expect-version "${GITHUB_REF_NAME#v}" dist/*

      - name: Show what would be published
        run: ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  # Upload. Split into its own job so the OIDC permission exists ONLY here. What actually stands
  # between a run and the index, measured rather than assumed (`gh api repos/<owner>/<repo>/
  # environments`): ONE blocker, the tag condition below, and one binding. The `pypi` environment
  # is the binding: it is part of the Trusted Publisher claim the index verifies (repository +
  # workflow + environment name), so a run outside it cannot mint a usable token. It is NOT a
  # second blocker today, and an earlier version of this comment said it was: the environment
  # carries `protection_rules: []` and `deployment_branch_policy: null`, so no required reviewer,
  # no wait timer, no ref restriction. The environment is where such a rule WOULD live, on the
  # GitHub side rather than the index side; adding one is a repository setting, not an edit here.
  # A manual rehearsal never reaches this job.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/epics-mcp
    permissions:
      id-token: write # Trusted Publishing; nothing else is needed and nothing else is granted
    steps:
      # NOT covered by a rehearsal: this job is gated on a tag AND on dry_run being false, so a
      # manual dry run never reaches this step, and the v8 bump made here could not be proven by
      # one. It IS covered by the real releases, and that is measured rather than assumed: this
      # step ran green in run 30767777703 (the v0.5.0 tag) and in 30531166469 (v0.4.0) before it,
      # both on @v8. A rehearsal remains no evidence for this job; a shipped tag is.
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
          # Stated, not inherited. Measured against the action.yml at v8: `digest-mismatch` takes
          # ignore/info/warn/error and already defaults to error, so this changes nothing today.
          # It is written out because the value is a safety decision (a corrupted artifact must
          # stop the release rather than reach the index) sitting in the one job that runs once,
          # at release time, and cannot be re-run. An inherited default can move in a v8.x; a
          # stated one cannot move without someone editing this line.
          digest-mismatch: error
      # Pinned to a COMMIT, and this is the one reference in either workflow where that is worth
      # the maintenance. `release/v1` is a mutable BRANCH (measured: the tag ref 404s, the branch
      # ref resolves), so whatever its head holds at release time runs inside the only job that
      # holds `id-token: write`, i.e. the one that can publish to the index as this project. The
      # five other references in these workflows are major TAGS, which are also mutable, but none
      # of them sits in a job with a publishing credential. Dependabot reads the version comment
      # and offers the bump, so this stays current without anyone watching a branch.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The GitHub release. A tag and a release are two different objects, and only the tag was ever
  # created: 0.3.0 shipped to the index while the repository's Releases page kept showing 0.2.0 as
  # "Latest", so the two public faces of the same project told different stories for a month. The
  # tag is what publishes; this job makes the release page agree with it.
  #
  # LAST, and depending on the upload: a release announcing a version that failed to upload would
  # be the same disagreement pointing the other way. It needs no `if:` of its own, because a job
  # whose `needs` was skipped is skipped too, so the rehearsal path stops here exactly as it stops
  # at the upload.
  #
  # Body from CHANGELOG.md rather than `--generate-notes`: the generated form lists commit
  # subjects, which would describe a release by its plumbing while ignoring the changelog this
  # project maintains. The slicer is stdlib-only, so this job needs no uv and no dependency install.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create a release; the OIDC token stays in the publish job
    steps:
      - uses: actions/checkout@v7
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/changelog_section.py "${GITHUB_REF_NAME}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
