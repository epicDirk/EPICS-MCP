name: CI

on: [push, pull_request]

jobs:
  # Tests on ubuntu-latest: the p4p Linux wheels are the battle-tested ones, and Linux was the OS
  # of the previous EPICS CI too. The `live` tests (IOC sandbox) self-skip because their
  # EPICS_MCP_* URL and EPICS_MCP_LIVE_* variables are unset here, so CI runs the offline suite.
  # Coverage is report-only (no --cov-fail-under gate), matching phoebus-display-mcp.
  #
  # The matrix exists to test the claim rather than decorate it: pyproject declares
  # requires-python = ">=3.12", so every version from 3.12 up is a version this package PERMITS,
  # and one it does not run is a combination a user is allowed to install and nobody has tried.
  # 3.14 is here for exactly that reason: it was released, the floor still admits it, and the
  # maintainer's own machine runs it. fail-fast is off so one version failing still reports the
  # others.
  #
  # Two limits of this matrix, written down because both invite the opposite reading:
  #
  #   * It is a CI signal, NOT a release gate. publish.yml builds and tests on 3.12 alone, so a
  #     green tag run says nothing about 3.14. That split is deliberate: a release is ONE
  #     deterministic artifact, and a pure-Python wheel does not differ per interpreter.
  #   * The static tools stay at the FLOOR (ruff target-version = py312, mypy python_version =
  #     3.12), which is correct for a floor and is why they cannot cover the top: mypy resolving
  #     against 3.12 cannot see an API that 3.14 REMOVED. Only a run on 3.14 can, which is what
  #     this leg buys and what the trove classifier promises.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    name: test (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # --locked, not --frozen, and the difference is the whole point of the step name. Both
      # install from the lockfile without re-resolving; only --locked also VERIFIES that the
      # lockfile still matches pyproject.toml. Under --frozen a dependency edit committed without
      # the matching `uv lock` installs the OLD set in silence, and CI reports green over a
      # dependency tree that no longer exists in the file it claims to follow (GB-33 c).
      - name: Install dependencies (exactly as uv.lock pins them)
        run: uv sync --extra dev --locked
      - name: Run tests with coverage (report only)
        run: uv run pytest tests/ --tb=short --cov=src --cov-branch --cov-report=term

  # Lint, format and types through the pre-commit chain: the same uv-pinned tools and the same
  # configuration as locally, so there is a single source of truth. Deliberately one version,
  # because mypy resolves against the python_version pinned in pyproject, not the runner's.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (exactly as uv.lock pins them)
        run: uv sync --extra dev --locked
      - name: pre-commit (ruff check + format + mypy)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # The coverage-dependent half of the sham-guard audit (scripts/guard_audit.py). Two of its six
  # pins are decided by WHICH TESTS EXECUTED a client-edge guard line, which the ordinary `test`
  # job cannot answer because it records no per-test contexts. Until this job they were re-recorded
  # by hand and verified by nobody: `sham --check` without a database names them as unreachable and
  # says so on every run, which is honest and is not a check.
  #
  # A JOB rather than a step, and no schedule. A step would add a full ctrace suite run, minutes,
  # to each of the three matrix legs; a parallel job adds almost no wall clock. A schedule would
  # report on a DAY instead of on a CHANGE, so the commit that moved a figure would already have
  # shipped, and the run could not be reproduced at that SHA by re-running the workflow.
  #
  # It REPORTS rather than blocks: main's ruleset holds non_fast_forward and deletion only, so no
  # required status check stands in front of a commit (tests/test_release_workflow.py records the
  # same fact and why it is deliberate). Read it, do not assume it gates.
  #
  # 3.12 because that is the declared floor and the cheapest leg; the audit reads the source tree
  # and the coverage map, neither of which is interpreter-specific.
  #
  # Like `test`, this job syncs WITHOUT `--group displays`, so the eight engine-coupled test modules
  # of tests/conftest.py never run here (docs/known-limits.md, entry 16). That is deliberate and it
  # is also what the recorded pins were checked against: measured locally in the same shape on
  # 2026-08-20, the run reproduces all six.
  sham-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (exactly as uv.lock pins them)
        run: uv sync --extra dev --locked
      # Three flags are load-bearing and none is decoration.
      #   COVERAGE_CORE=ctrace: where sys.monitoring is the default core it disables a location
      #     after its FIRST observation, so a map recorded without it sees a fraction of the
      #     covering tests and the audit reports false survivors. Measured on 2026-08-20 on this
      #     tree, both maps in this job's shape: 246 test functions execute a client-edge guard
      #     line under ctrace, 75 under the default core, and the audit exits 1 on the second.
      #     On THIS runner it is belt and braces rather than load-bearing: coverage 7.14.1 sets
      #     SYSMON_DEFAULT = CPYTHON and PYVERSION >= (3, 14), so 3.12 records a C-tracer map
      #     either way. It is set because the interpreter above is a choice that can change, and
      #     because this job is also the executable form of the recipe CONTRIBUTING.md hands a
      #     developer, whose own machine may well be 3.14. The 75-versus-246 figure was measured
      #     there.
      #   --cov-branch: guard_audit reads the `arc` table. Without branch coverage that table is
      #     empty while the data sits in `line_bits`, which yields a silently EMPTY map.
      #   --cov-context=test: without it there are no per-test contexts, which is the whole input.
      # COVERAGE_FILE points outside the checkout, the same rule the local recipe in
      # scripts/guard_audit.py states, so a run never overwrites a working .coverage.
      - name: Record a C-tracer map with per-test contexts
        env:
          COVERAGE_CORE: ctrace
          COVERAGE_FILE: ${{ runner.temp }}/sham-cov
        run: uv run pytest tests/ -q --cov=src --cov-branch --cov-context=test --cov-report=
      # Exit codes are already contracted, so no wrapper: 0 agreement, 1 a pin deviates or the
      # candidate list changed, 2 a blind map or a broken services anchor, 9 a crash. Every non-zero
      # should fail this step. A green run prints "checked 6 pin(s)"; "checked 4 pin(s)" would mean
      # the database was never read, and that is asserted in tests/test_guard_audit_cli.py rather
      # than grepped for here, because nothing versions a shell pipeline.
      - name: The sham audit's coverage-dependent pins and its candidate list
        run: uv run python scripts/guard_audit.py sham --check --coverage-db "${{ runner.temp }}/sham-cov"
