name: CI

# TRIGGER AND CONCURRENCY, changed on 2026-09-01 under GQ-38. Both are hygiene here rather than
# saving, and saying so is the point: this repository is PUBLIC, so its Actions minutes are free.
# The three private siblings pay, and their bill is what that ticket is about. What IS measurable
# here is the double run: dependabot pushes a branch and opens a pull request for the same commit,
# so today it starts two runs. A branch filter leaves the pull_request one, which is the one a
# reviewer looks at.
#
# THE GROUP KEY CARRIES THE EVENT, and that is not decoration. Under a bare github.ref a run
# started by hand and a push sit in the SAME group, while cancel-in-progress evaluates to false
# for a dispatch, so an arriving dispatch neither cancels nor gets cancelled, it just waits behind
# a run it has nothing to do with. Measured on real runs of 2026-08-09 in the sibling repository
# epicDirk/opi-foundry: two push runs were caught 6 and 7 seconds later by a dispatch of the same
# workflow and were NOT cancelled. With the event in the key the two never share a group.
#
# workflow_dispatch is new, so the state of this workflow can be measured without producing a real
# push. That is exactly what was missing in the private siblings while they had no quota left.
#
# WHAT THE BRANCH FILTER GIVES UP, named rather than assumed: a push to any branch other than main
# now starts no run at all, only a pull request does. Measured over 2026-08-09 to 2026-08-16, all
# 241 runs of the three private repositories sat on their working branch; here the exception is
# real and it is dependabot, which is precisely the case the filter is meant to halve.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Tests on ubuntu-latest: the p4p Linux wheels are the battle-tested ones, and Linux was the OS
  # of the previous EPICS CI too. The `live` tests (IOC sandbox) self-skip because their
  # EPICS_MCP_* URL and EPICS_MCP_LIVE_* variables are unset here, so CI runs the offline suite.
  # Coverage carries a FLOOR since GB-34, and the value is the CI number rather than the local
  # one. See the step at the bottom of this job for how it was derived and how to raise it.
  #
  # The matrix exists to test the claim rather than decorate it: pyproject declares
  # requires-python = ">=3.12", so every version from 3.12 up is a version this package PERMITS,
  # and one it does not run is a combination a user is allowed to install and nobody has tried.
  # 3.14 is here for exactly that reason: it was released, the floor still admits it, and the
  # maintainer's own machine runs it. fail-fast is off so one version failing still reports the
  # others.
  #
  # Two limits of this matrix, written down because both invite the opposite reading:
  #
  #   * It is a CI signal, NOT a release gate. publish.yml builds and tests on 3.12 alone, so a
  #     green tag run says nothing about 3.14. That split is deliberate: a release is ONE
  #     deterministic artifact, and a pure-Python wheel does not differ per interpreter.
  #   * The static tools stay at the FLOOR (ruff target-version = py312, mypy python_version =
  #     3.12), which is correct for a floor and is why they cannot cover the top: mypy resolving
  #     against 3.12 cannot see an API that 3.14 REMOVED. Only a run on 3.14 can, which is what
  #     this leg buys and what the trove classifier promises.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    name: test (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # --locked, not --frozen, and the difference is the whole point of the step name. Both
      # install from the lockfile without re-resolving; only --locked also VERIFIES that the
      # lockfile still matches pyproject.toml. Under --frozen a dependency edit committed without
      # the matching `uv lock` installs the OLD set in silence, and CI reports green over a
      # dependency tree that no longer exists in the file it claims to follow (GB-33 c).
      - name: Install dependencies (exactly as uv.lock pins them)
        run: uv sync --extra dev --locked
      # A FLOOR, not a target, and it closes a gap CONTRIBUTING.md's Definition of Done had
      # been asserting without a mechanism ("coverage not reduced") since before this file
      # existed.
      #
      # THE VALUE IS THE CI NUMBER, AND IT IS NOT THE LOCAL ONE. This job syncs without
      # `--group displays`, so the eight engine-coupled test modules of tests/conftest.py never
      # run here and their lines count as missed (docs/known-limits.md, entry 16). Measured
      # 2026-08-20 on run 32382275776: all three legs report 87%, while the same tree measured
      # locally with the displays group installed reports 94%. A floor taken from a local run
      # would therefore be red here on the day it was written, which is why the derivation names
      # the run it came from.
      #
      # HOW TO MOVE IT: read the TOTAL line of each of the three legs of a green run
      # (`gh run view <id> --log | grep '^TOTAL'`), take the LOWEST, round down, subtract one,
      # and record the run id and the date here. Raise it when it is comfortably cleared; never
      # lower it to make a red run green. One point is roughly 81 measurable items at this
      # repository's size, so the single point of margin is deliberate rather than timid.
      #
      # --cov-precision=2 is LOAD-BEARING, not cosmetic, and the first version of this comment
      # said the opposite. coverage compares `round(total, precision) < fail_under`
      # (coverage/results.py), and pytest-cov defaults the precision to 0 when the flag is
      # absent. Measured: at a total of 85.6 against this floor of 86, precision 0 rounds to 86
      # and PASSES while precision 2 FAILS. So the flag tightens the gate across a half-point
      # band, on top of giving the next person to move the floor an exact number to move it
      # from. Removing it silently loosens the floor by up to half a point.
      #
      # DELIBERATELY ON THE COMMAND LINE, never in [tool.coverage.report]. pytest-cov reads
      # fail_under out of the coverage config when the flag is absent (pytest_cov/plugin.py),
      # so putting it there would fail a PARTIAL local run, e.g.
      # `uv run pytest tests/test_olog.py --cov=src`, for a reason that is not a regression. The
      # predictable adaptation to that is to stop passing --cov locally, which is strictly worse
      # than having no floor.
      - name: Run tests with coverage (a floor, not a target)
        run: uv run pytest tests/ --tb=short --cov=src --cov-branch --cov-report=term --cov-precision=2 --cov-fail-under=86

  # Lint, format and types through the pre-commit chain: the same uv-pinned tools and the same
  # configuration as locally, so there is a single source of truth. Deliberately one version,
  # because mypy resolves against the python_version pinned in pyproject, not the runner's.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (exactly as uv.lock pins them)
        run: uv sync --extra dev --locked
      - name: pre-commit (ruff check + format + mypy)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # The coverage-dependent half of the sham-guard audit (scripts/guard_audit.py). Two of its six
  # pins are decided by WHICH TESTS EXECUTED a client-edge guard line, which the ordinary `test`
  # job cannot answer because it records no per-test contexts. Until this job they were re-recorded
  # by hand and verified by nobody: `sham --check` without a database names them as unreachable and
  # says so on every run, which is honest and is not a check.
  #
  # A JOB rather than a step, and no schedule. A step would add a full ctrace suite run, minutes,
  # to each of the three matrix legs; a parallel job adds almost no wall clock. A schedule would
  # report on a DAY instead of on a CHANGE, so the commit that moved a figure would already have
  # shipped, and the run could not be reproduced at that SHA by re-running the workflow.
  #
  # It REPORTS rather than blocks: main's ruleset holds non_fast_forward and deletion only, so no
  # required status check stands in front of a commit (tests/test_release_workflow.py records the
  # same fact and why it is deliberate). Read it, do not assume it gates.
  #
  # 3.12 because that is the declared floor; the audit reads the source tree and the coverage map,
  # neither of which is interpreter-specific. ⚠️ NOT because it is the cheapest: measured on the
  # two runs this file cites, 3.12 is the SLOWEST leg (69.9 s and 68.4 s, against 47.1 s and
  # 41.5 s on 3.14). An earlier version of this line said cheapest, which was never measured.
  #
  # Like `test`, this job syncs WITHOUT `--group displays`, so the eight engine-coupled test modules
  # of tests/conftest.py never run here (docs/known-limits.md, entry 16). That is deliberate and it
  # is also what the recorded pins were checked against: measured locally in the same shape on
  # 2026-08-20, the run reproduces all six.
  sham-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (exactly as uv.lock pins them)
        run: uv sync --extra dev --locked
      # Three flags are load-bearing and none is decoration.
      #   COVERAGE_CORE=ctrace: where sys.monitoring is the default core it disables a location
      #     after its FIRST observation, so a map recorded without it sees a fraction of the
      #     covering tests and the audit reports false survivors. Measured on 2026-08-20 on this
      #     tree, both maps in this job's shape: 246 test functions execute a client-edge guard
      #     line under ctrace, 75 under the default core. ⚠️ The audit DID exit 1 on the second,
      #     and that was luck rather than the mechanism: the two cores attribute differently, so
      #     the poorer map happened to show one execution the good one did not. A map that merely
      #     sees LESS cannot move the pins at all, which is why --min-covering-tests exists below.
      #     On THIS runner it is belt and braces rather than load-bearing: coverage 7.14.1 sets
      #     SYSMON_DEFAULT = CPYTHON and PYVERSION >= (3, 14), so 3.12 records a C-tracer map
      #     either way. It is set because the interpreter above is a choice that can change, and
      #     because this job is also the executable form of the recipe CONTRIBUTING.md hands a
      #     developer, whose own machine may well be 3.14. The 75-versus-246 figure was measured
      #     there.
      #   --cov-branch: guard_audit reads the `arc` table. Without branch coverage that table is
      #     empty while the data sits in `line_bits`, which yields a silently EMPTY map.
      #   --cov-context=test: without it there are no per-test contexts, which is the whole input.
      # COVERAGE_FILE points outside the checkout, the same rule the local recipe in
      # scripts/guard_audit.py states, so a run never overwrites a working .coverage.
      - name: Record a C-tracer map with per-test contexts
        env:
          COVERAGE_CORE: ctrace
          COVERAGE_FILE: ${{ runner.temp }}/sham-cov
        run: uv run pytest tests/ -q --cov=src --cov-branch --cov-context=test --cov-report=
      # Exit codes are already contracted, so no wrapper: 0 agreement, 1 a pin deviates or the
      # candidate list changed, 2 a blind map or a broken services anchor, 9 a crash. Every non-zero
      # should fail this step. A green run prints "checked 6 pin(s)"; "checked 4 pin(s)" would mean
      # the database was never read.
      #
      # ⛔ THE ONE SILENT ROT IS RIGHT HERE, IN THIS COMMAND, and no test can see it. Every other
      # way of losing the map is loud: a missing or unreadable database exits 9, a map without
      # per-test contexts is empty and exits 2, a small map is refused by the floor below.
      # Deleting --coverage-db from THIS LINE is the exception: the tool then takes its
      # no-database branch, prints "checked 4 pin(s): all agree" and exits 0, and the job goes
      # green having checked only the half the ordinary gate already checks. The count in the
      # verdict line is pinned in tests/test_guard_audit_cli.py so the symptom is recognisable
      # in this log; keeping the flag here is the part only a reader of this file can do.
      #
      # ⛔ --min-covering-tests IS NOT OPTIONAL FOR AN UNATTENDED CALLER, and the first version of
      # this job did not have it. The two pinned coverage figures sit at their arithmetic maximum,
      # so a map that measured almost nothing still AGREES with them. Measured on this tree: a map
      # recorded from one test module covers 30 test functions and printed "checked 6 pin(s): all
      # agree", exit 0. The floor is what turns a worthless map into a refusal; the pins cannot.
      # 200 against a measured 246, which leaves room for the suite to shrink a little and none for
      # a map recorded wrongly (75 without ctrace on 3.14, 30 from a single module). Raise it as the
      # suite grows; the reasoning is at the check itself in scripts/guard_audit.py.
      - name: The sham audit's coverage-dependent pins and its candidate list
        run: >-
          uv run python scripts/guard_audit.py sham --check
          --coverage-db "${{ runner.temp }}/sham-cov"
          --min-covering-tests 200
