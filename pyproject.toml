[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epics-mcp"
version = "0.6.0"
description = "MCP server for EPICS: live PV values, connection diagnosis, and cross-plane provenance"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "epicDirk" }]
keywords = ["epics", "mcp", "pvaccess", "channel-access", "p4p", "controls"]
requires-python = ">=3.12"
# Trove classifiers: the facets a package index sorts and filters on. Without them the project page
# renders as an unfinished stub and the index cannot categorise the package at all.
#
# Each one is a claim, so each is one this repository can back:
#   * "4 - Beta" means feature-complete and under test, which is what this is: every plane the
#     README table names, and both write gates, are built and covered. The count that used to
#     stand here said "five", which matched no counting the repository does: the README names
#     eight, epics-doctor probes seven, and five is the number of optional REST services. A claim
#     is kept, the unbacked figure is not. It does NOT mean stable, and the instability is
#     stated where a user looks for it, in CHANGELOG.md ("pre-1.0: minor versions may carry
#     breaking changes"). Moving this row up or down is a judgement about the project, not a
#     formality, so it is made here deliberately rather than copied from a template.
#   * "OS Independent" is measured, not assumed: the suite runs on Windows locally and on Linux in
#     CI, and p4p ships wheels for both.
#   * "Typing :: Typed" requires a py.typed marker to be true. It exists and ships in the wheel,
#     asserted by name in tests/test_packaging.py::test_package_data_ships_in_the_wheel. That
#     assertion was added when this comment was found citing a check that only covered the
#     operator guide (QA-37): no code here reads the marker, so nothing else can notice it going
#     missing.
#   * 3.12, 3.13 and 3.14 are exactly the versions the CI matrix runs. The rule is the same one
#     that admitted 3.14: a row here is a promise, so it appears when a leg exercises it and not
#     before. requires-python permits every version from the floor up, which is why the matrix
#     has to reach the top rather than stop where it is comfortable. ⚠️ The promise is backed by
#     the CI matrix, not by the release build: publish.yml builds on 3.12 alone (see its comment),
#     so a green tag run is no evidence for any row below it.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    # Standalone FastMCP (gofastmcp.com) is the server runtime: server.py uses
    # `from fastmcp import FastMCP` and `from fastmcp.exceptions import ToolError`.
    # (The server used to run on the SDK-bundled FastMCP 1.0 from `mcp`; the move puts
    # both project MCPs on ONE stack and removes the two-ToolError footgun by
    # construction: there is now exactly one fastmcp on the path.)
    "fastmcp>=3,<4",
    # mcp stays declared explicitly: we import `mcp.types.ToolAnnotations` directly
    # (fastmcp re-exports the low-level types and pulls mcp transitively anyway).
    "mcp>=1.0,<2",
    # pydantic>=2.11: the floor of the core deps (mcp/pydantic-settings) and of the optional
    # opi_navigation (see the `displays` group); stated explicitly here so the intent is visible.
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.0,<3",
    "p4p>=4.2.0,<5",
    # requests: read-only HTTP client for the ESS Naming Service (services/naming_client.py).
    "requests>=2.25",
    # urllib3 is imported DIRECTLY (services/_http.py imports urllib3.exceptions and urllib3.util),
    # so it is a dependency of this package and not only of requests. Declared for metadata
    # correctness rather than to fix a breakage: requests pins urllib3 hard, so no install can
    # reach this code without it and no failure is constructible today. Undeclared, the truth of
    # that depended on a transitive edge somebody else is free to change.
    #
    # Why the floor is 1.26 and not something newer: the three APIs used are urllib3.util.parse_url,
    # urllib3.exceptions.LocationParseError, and Retry(total, backoff_factor, status_forcelist),
    # all present in 1.26. A higher floor would exclude environments this code runs on for no
    # measured reason. No upper cap: the 2.x line kept all three, and requests carries its own.
    #
    # It is load-bearing rather than incidental: the reach decision in olog_safety.py and the
    # loopback boundary in _http.py deliberately parse with urllib3, the parser requests actually
    # CONNECTS through, because urlparse and urllib3 disagree on a userinfo-bearing authority.
    "urllib3>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit>=4.0",
]
# There is deliberately no `all` extra, and it is absent rather than merely unused. Until 0.4.0 it
# existed and resolved to exactly `epics-mcp[dev]`, so `pip install epics-mcp[all]` promised a
# reader everything the package can do and delivered the developer toolchain. The display-aware
# tools are not an extra either, see the `displays` dependency group below, so there is nothing an
# `all` could honestly gather.

# Dependency groups (PEP 735) are a LOCAL install surface: unlike an extra, they never reach the
# published metadata. That is exactly why the display dependency lives here.
#
# The display-aware tools (validate_pvs / crossplane_check / coverage_audit / find_device) join live
# PVs with the macro-expanded per-instance PV inventory from the opi_navigation PV engine: ONE
# engine, never a macro-blind reimplementation. That engine lives in a PRIVATE repository, so an
# outside user cannot install it by any route, and advertising it as an extra told them otherwise.
# It was an extra until 2026-07-28, and a direct git reference in published metadata is also the one
# thing PyPI rejects outright, so the same move unblocks publishing and stops the false promise.
#
# ⏳ REVISIT once the Java live plugin and the CS-Studio MCP have been tested in practice
# (maintainer decision, 2026-07-28). The answer to "should outside users get the display tools" is
# "not yet", not "no"; the release checklist in CONTRIBUTING.md carries the same note, so the
# condition does not live only here.
#
# Local full run: `uv sync --extra dev --group displays`, and then
# `EPICS_MCP_REQUIRE_DISPLAYS=1 uv run pytest tests/`, which refuses instead of silently skipping
# if the engine is missing after all (GB-27). CI deliberately does NOT pass --group, so it tests
# exactly the standalone core a public user gets (conftest.py drops the display test modules it lists
# when opi_navigation is absent). That skip is no longer silent: a run that drops them says so in
# its report header, because a green report over 100 tests that never ran is indistinguishable
# from a full one. Why CI cannot simply run them, and where they DO run since 2026-08-04:
# docs/known-limits.md, entry 16.
#
# ⚠️ THE NAME BELOW IS NOT RESERVED ON THE PUBLIC INDEX, AND THAT MAKES THIS GROUP A DEPENDENCY-
# CONFUSION SURFACE FOR ANY RESOLVER THAT IS NOT uv. Measured 2026-08-15: an index lookup of both
# spellings, `opi-navigation` and `opi_navigation`, answers 404, so the name is free for anyone to
# claim. What holds the requirement to the private repository is `[tool.uv.sources]` below, and
# that table is uv-only, resolution-time information: it is neither published metadata nor
# something pip reads. `pip install --group displays` therefore resolves the bare name straight
# from the index, and on the day somebody registers it, that install silently succeeds with a
# stranger's code instead of failing honestly the way it does today.
#
# So: install this group with uv, or name the source explicitly. Reserving the name was weighed
# and NOT taken (it stays deliberately unclaimed); the surface disappears for good once the engine
# ships as part of one combined distribution rather than as a separately resolvable name.
#
# A comment cannot enforce this, and it is not asked to. What does is
# tests/test_dependency_pin.py::test_every_dependency_group_member_is_source_pinned: a second
# member added here without a `[tool.uv.sources]` entry of its own is a red test, not a silent new
# instance of the same hole.
[dependency-groups]
displays = ["opi-navigation"]

# The git pin lives here rather than in the requirement itself: tool.uv.sources is resolution-time
# information and is NOT part of the built distribution's metadata. A bump moves this rev and
# `uv lock` together, and tests/test_dependency_pin.py fails when only one of the two moves.
#
# That test exists because the sentence here used to name `uv sync --frozen` as the thing enforcing
# it, and measured against `uv help sync` that flag enforces the opposite: it "uses the versions in
# the lockfile as the source of truth", and changes in pyproject.toml that are not in the lockfile
# yet "will not be present in the environment". So a half-done bump resolved the OLD engine in
# silence. (`--locked` would have caught it. Swapping the flag was judged a wider change than
# pinning the promise with a test, so the promise got the test first. ⚠️ The flag HAS since been
# swapped, in both workflows and in the two documented local commands, so the two now overlap
# rather than substitute for each other: `--locked` refuses a lockfile that disagrees with
# pyproject.toml, while this test additionally reads the RESOLVED entry, which `--locked` does not
# look at. The test stays for that second half.) Note also that this CI syncs without
# `--group displays` and therefore never resolves this dependency at all: the lock entry is checked
# here, not exercised there.
[tool.uv.sources]
opi-navigation = { git = "https://github.com/epicDirk/opi-foundry.git", rev = "0ab0d736db6d3bf92fd325d1fd69992d2ff62e92" }

[project.urls]
Homepage = "https://github.com/epicDirk/EPICS-MCP"
Repository = "https://github.com/epicDirk/EPICS-MCP"
Issues = "https://github.com/epicDirk/EPICS-MCP/issues"
Changelog = "https://github.com/epicDirk/EPICS-MCP/blob/main/CHANGELOG.md"
# Deployment is the page an outside adopter needs first, so it is what "Documentation" points at.
Documentation = "https://github.com/epicDirk/EPICS-MCP/blob/main/docs/deployment.md"

# The import package now matches the distribution name, so hatchling would find src/epics_mcp on
# its own. The section stays explicit anyway: a src-layout package found by convention is found
# silently, and the day a second package or a data directory appears here, an implicit rule decides
# what ships without anyone having written it down.
[tool.hatch.build.targets.wheel]
packages = ["src/epics_mcp"]

# The sdist was UNDECLARED, and an undeclared sdist is not "the tracked tree": hatchling packs the
# working tree minus what VCS ignores, so it also packs every untracked, unignored file that
# happens to be lying there when the build runs. Measured on 0.4.0: 192 files, which is 190 tracked
# + PKG-INFO + a stray `x.log` nobody meant to publish. It shipped all 81 test files, scripts/,
# .github/ and CLAUDE.md (this repository's internal agent instructions) to a public index, since
# .github/workflows/publish.yml builds BOTH artifacts and uploads the whole dist/ directory.
#
# Scope: the package a consumer installs, plus the documentation they read. Contributors get the
# repository. tests/, scripts/, .github/ and CLAUDE.md are development surface and stay out; a
# consumer cannot run the suite from an sdist anyway, because nine test modules import from
# scripts/ and three more read .github/ and .pre-commit-config.yaml.
#
# ⚠️ only-include is a PATH-PREFIX filter, NOT a VCS filter, and that was measured before it was
# relied on: a stray untracked file INSIDE an included directory still ships. So this declaration
# alone does not close the hole it was written for, and it is not asked to. What closes it is
# tests/test_packaging.py, which builds the sdist and compares its members against `git ls-files`
# in both directions. Do not treat this list as the guard.
#
# ⚠️ Four paths ship whether or not they are named here: hatchling force-includes pyproject.toml,
# the VCS ignore files, the readme and the license. `.gitignore` therefore appears in the artifact
# while being absent from this list, which is why the guard reads the ARTIFACT rather than this
# declaration: a guard comparing the two lists would have recorded a falsehood and stayed green.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "docs",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "ARCHITECTURE.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "OPERATING.md",
    "CITATION.cff",
    ".env.example",
    "pyproject.toml",
]

[project.scripts]
epics-mcp = "epics_mcp.server:main"
epics-crossplane = "epics_mcp.cli_crossplane:main"
epics-coverage = "epics_mcp.cli_coverage:main"
epics-diagnose = "epics_mcp.cli_diagnose:main"
epics-doctor = "epics_mcp.cli_doctor:main"
epics-init = "epics_mcp.cli_init:main"
epics-testpv = "epics_mcp.cli_testpv:main"

# No [tool.hatch.metadata] allow-direct-references any more: it existed solely for the
# opi-navigation git requirement, which is now a dependency group with its source in
# [tool.uv.sources] and therefore never reaches the built metadata. Leaving the flag would leave
# standing permission for the one thing that blocks publishing, with nothing using it.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Rule set mirrored from the sibling MCP (phoebus-display-mcp): BLE catches a blind
# `except Exception`, T20 forbids print() (stdout is the stdio server's JSON-RPC channel).
# The set originates in the workspace quality standard and reached this repository through
# phoebus-display-mcp. The intermediate copy had lost that attribution; whoever inherits or
# changes the set should inherit the reasoning with it, not just a list to copy.
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "PERF", "ANN", "BLE", "T20"]
# Two characters stay tolerated: the typographic apostrophe, legitimate in English prose, and
# the multiplication sign, which no ASCII substitute replaces. Everything else was REMOVED
# from this list, which turns ruff into a second, independent guard for the characters it
# actually knows here.
#
# Measured, because the list invites the opposite assumption (re-measured 2026-07-28, the first
# write-up undercounted): probed one character at a time through
# `ruff --isolated --select RUF001,RUF002,RUF003`, ruff recognises FIVE of the nine entries this
# list used to carry: the en dash, the apostrophe, the multiplication sign and both single curly
# quotes (U+2018, U+201A). The em dash and the three double curly quotes produce NO finding, in
# a string, a docstring or a comment alike, so those four entries were no-ops. Removing the
# no-ops buys honesty; removing the en dash and the single quotes buys a guard, since all three
# are forbidden here. The characters ruff cannot see are covered by
# scripts/check_typography.py, which reads every text file, not just Python.
allowed-confusables = ["’", "×"]

[tool.ruff.lint.per-file-ignores]
# Annotations are mandatory in src/; in tests mypy --strict enforces them and ruff stays out of
# the way (same split as the sibling MCP).
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# p4p ships no type stubs. opi_navigation IS typed (py.typed) but optional (the displays group) and
# on the public-fork CI (private git dependency), so the override lets mypy swallow
# `import-not-found` there and its symbols become Any. LOCALLY this is a no-op: with
# opi_navigation installed mypy keeps using its real types and the display surface stays fully
# checked.
[[tool.mypy.overrides]]
module = [
    "p4p.*",
    "p4p",
    "requests",
    "requests.*",
    "urllib3",
    "urllib3.*",
    "opi_navigation.*",
    "yaml",
]
ignore_missing_imports = true

# The display-coupled TEST modules carry `# type: ignore[arg-type]` comments that suppress arg-type
# errors against opi_navigation's REAL types (fully checked with the displays group installed). On
# the public-fork CI opi_navigation is absent → its symbols become Any (override above) → those
# ignores become UNUSED and mypy --strict's warn_unused_ignores would fail the lint job. Relax ONLY
# that one check for ONLY these modules (they are also pytest-skipped without opi_navigation via
# conftest.collect_ignore); every other strict check on them, and all other modules, is unaffected.
[[tool.mypy.overrides]]
module = [
    "tests.test_validate",
    "tests.test_crossplane_tool",
    "tests.test_coverage_tool",
    "tests.test_find_device_tool",
    "tests.test_device_lookup",
    "tests.test_inventory_adapter",
]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
# `live` = tests that need a running local EPICS test stack. Opt-in: set the target plane's
# `EPICS_MCP_*` vars, then `uv run pytest -m live`. Each live module gates itself at SETUP time
# via tests/live_gate.py (assert_live_available): with the plane vars unset it SKIPS, so the
# default run and CI stay green, but a DEMANDED live run (EPICS_MCP_REQUIRE_LIVE=1) turns a
# missing prerequisite into a LOUD failure instead of a silent skip (S30; previously
# `pytest -m live` in an empty env exited 0 with everything skipped, indistinguishable from a
# fulfilled live run). The demand applies to the SELECTED set: scope a partial live run with
# `-m live -k <plane>`; data-dependent skips INSIDE a running probe stay skips. Deliberately NO
# `addopts = -m "not live"` (would change default pytest for everyone and is brittle).
markers = [
    "live: needs a running local EPICS stack; opt-in via -m live + the plane's EPICS_MCP_* vars; EPICS_MCP_REQUIRE_LIVE=1 turns a missing prerequisite into a loud failure",
]
