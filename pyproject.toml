[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epics-mcp"
version = "0.4.0"
description = "MCP Server for EPICS PV access via p4p (PVAccess + Channel Access)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "epicDirk" }]
keywords = ["epics", "mcp", "pvaccess", "channel-access", "p4p", "controls"]
requires-python = ">=3.12"
# Trove classifiers: the facets a package index sorts and filters on. Without them the project page
# renders as an unfinished stub and the index cannot categorise the package at all.
#
# Each one is a claim, so each is one this repository can back:
#   * "4 - Beta" means feature-complete and under test, which is what this is: all five planes and
#     both write gates are built and covered. It does NOT mean stable, and the instability is
#     stated where a user looks for it, in CHANGELOG.md ("pre-1.0: minor versions may carry
#     breaking changes"). Moving this row up or down is a judgement about the project, not a
#     formality, so it is made here deliberately rather than copied from a template.
#   * "OS Independent" is measured, not assumed: the suite runs on Windows locally and on Linux in
#     CI, and p4p ships wheels for both.
#   * "Typing :: Typed" requires a py.typed marker to be true. It exists and ships in the wheel
#     (asserted by tests/test_packaging.py's wheel-content check for package data).
#   * 3.12 and 3.13 are exactly the versions the CI matrix runs. No 3.14 row until one does.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    # Standalone FastMCP (gofastmcp.com) is the server runtime: server.py uses
    # `from fastmcp import FastMCP` and `from fastmcp.exceptions import ToolError`.
    # (The server used to run on the SDK-bundled FastMCP 1.0 from `mcp`; the move puts
    # both project MCPs on ONE stack and removes the two-ToolError footgun by
    # construction: there is now exactly one fastmcp on the path.)
    "fastmcp>=3,<4",
    # mcp stays declared explicitly: we import `mcp.types.ToolAnnotations` directly
    # (fastmcp re-exports the low-level types and pulls mcp transitively anyway).
    "mcp>=1.0,<2",
    # pydantic>=2.11: the floor of the core deps (mcp/pydantic-settings) and of the optional
    # opi_navigation (see the `displays` group); stated explicitly here so the intent is visible.
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.0,<3",
    "p4p>=4.2.0,<5",
    # requests: read-only HTTP client for the ESS Naming Service (vendored naming_client).
    "requests>=2.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit>=4.0",
]
# Everything a published install can offer: the dev toolchain. The display-aware tools are NOT an
# extra, see the `displays` dependency group below.
all = [
    "epics-mcp[dev]",
]

# Dependency groups (PEP 735) are a LOCAL install surface: unlike an extra, they never reach the
# published metadata. That is exactly why the display dependency lives here.
#
# The display-aware tools (validate_pvs / crossplane_check / coverage_audit / find_device) join live
# PVs with the macro-expanded per-instance PV inventory from the opi_navigation PV engine: ONE
# engine, never a macro-blind reimplementation. That engine lives in a PRIVATE repository, so an
# outside user cannot install it by any route, and advertising it as an extra told them otherwise.
# It was an extra until 2026-07-28, and a direct git reference in published metadata is also the one
# thing PyPI rejects outright, so the same move unblocks publishing and stops the false promise.
#
# ⏳ REVISIT once the Java live plugin and the CS-Studio MCP have been tested in practice
# (maintainer decision, 2026-07-28). The answer to "should outside users get the display tools" is
# "not yet", not "no"; the release checklist in CONTRIBUTING.md carries the same note, so the
# condition does not live only here.
#
# Local full run: `uv sync --extra all --group displays`. CI deliberately does NOT pass --group, so
# it tests exactly the standalone core a public user gets (conftest.py skips the 6 display test
# modules when opi_navigation is absent).
[dependency-groups]
displays = ["opi-navigation"]

# The git pin lives here rather than in the requirement itself: tool.uv.sources is resolution-time
# information and is NOT part of the built distribution's metadata. A bump moves this rev and
# `uv lock` together (CI runs `uv sync --frozen`).
[tool.uv.sources]
opi-navigation = { git = "https://github.com/epicDirk/opi-foundry.git", rev = "8fad86766891aeac177050449f73a3a4fbf554cc" }

[project.urls]
Homepage = "https://github.com/epicDirk/EPICS-MCP"
Repository = "https://github.com/epicDirk/EPICS-MCP"
Issues = "https://github.com/epicDirk/EPICS-MCP/issues"
Changelog = "https://github.com/epicDirk/EPICS-MCP/blob/main/CHANGELOG.md"
# Deployment is the page an outside adopter needs first, so it is what "Documentation" points at.
Documentation = "https://github.com/epicDirk/EPICS-MCP/blob/main/docs/deployment.md"

# The import package now matches the distribution name, so hatchling would find src/epics_mcp on
# its own. The section stays explicit anyway: a src-layout package found by convention is found
# silently, and the day a second package or a data directory appears here, an implicit rule decides
# what ships without anyone having written it down.
[tool.hatch.build.targets.wheel]
packages = ["src/epics_mcp"]

[project.scripts]
epics-mcp = "epics_mcp.server:main"
epics-crossplane = "epics_mcp.cli_crossplane:main"
epics-coverage = "epics_mcp.cli_coverage:main"
epics-diagnose = "epics_mcp.cli_diagnose:main"
epics-doctor = "epics_mcp.cli_doctor:main"

# No [tool.hatch.metadata] allow-direct-references any more: it existed solely for the
# opi-navigation git requirement, which is now a dependency group with its source in
# [tool.uv.sources] and therefore never reaches the built metadata. Leaving the flag would leave
# standing permission for the one thing that blocks publishing, with nothing using it.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Rule set mirrored from the sibling MCP (phoebus-display-mcp): BLE catches a blind
# `except Exception`, T20 forbids print() (stdout is the stdio server's JSON-RPC channel).
# The set originates in the workspace quality standard and reached this repository through
# phoebus-display-mcp. The intermediate copy had lost that attribution; whoever inherits or
# changes the set should inherit the reasoning with it, not just a list to copy.
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "PERF", "ANN", "BLE", "T20"]
# Two characters stay tolerated: the typographic apostrophe, legitimate in English prose, and
# the multiplication sign, which no ASCII substitute replaces. Everything else was REMOVED
# from this list, which turns ruff into a second, independent guard for the characters it
# actually knows here.
#
# Measured, because the list invites the opposite assumption (re-measured 2026-07-28, the first
# write-up undercounted): probed one character at a time through
# `ruff --isolated --select RUF001,RUF002,RUF003`, ruff recognises FIVE of the nine entries this
# list used to carry: the en dash, the apostrophe, the multiplication sign and both single curly
# quotes (U+2018, U+201A). The em dash and the three double curly quotes produce NO finding, in
# a string, a docstring or a comment alike, so those four entries were no-ops. Removing the
# no-ops buys honesty; removing the en dash and the single quotes buys a guard, since all three
# are forbidden here. The characters ruff cannot see are covered by
# scripts/check_typography.py, which reads every text file, not just Python.
allowed-confusables = ["’", "×"]

[tool.ruff.lint.per-file-ignores]
# Annotations are mandatory in src/; in tests mypy --strict enforces them and ruff stays out of
# the way (same split as the sibling MCP).
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# p4p ships no type stubs. opi_navigation IS typed (py.typed) but optional ([displays]) and absent
# on the public-fork CI (private git dependency), so the override lets mypy swallow
# `import-not-found` there and its symbols become Any. LOCALLY this is a no-op: with
# opi_navigation installed mypy keeps using its real types and the display surface stays fully
# checked.
[[tool.mypy.overrides]]
module = [
    "p4p.*",
    "p4p",
    "requests",
    "requests.*",
    "urllib3",
    "urllib3.*",
    "opi_navigation.*",
]
ignore_missing_imports = true

# The display-coupled TEST modules carry `# type: ignore[arg-type]` comments that suppress arg-type
# errors against opi_navigation's REAL types (fully checked when [displays] is installed locally). On
# the public-fork CI opi_navigation is absent → its symbols become Any (override above) → those
# ignores become UNUSED and mypy --strict's warn_unused_ignores would fail the lint job. Relax ONLY
# that one check for ONLY these modules (they are also pytest-skipped without opi_navigation via
# conftest.collect_ignore); every other strict check on them, and all other modules, is unaffected.
[[tool.mypy.overrides]]
module = [
    "tests.test_validate",
    "tests.test_crossplane_tool",
    "tests.test_coverage_tool",
    "tests.test_find_device_tool",
    "tests.test_device_lookup",
    "tests.test_inventory_adapter",
]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
# `live` = tests that need a running local EPICS test stack. Opt-in: set the target plane's
# `EPICS_MCP_*` vars, then `uv run pytest -m live`. Each live module gates itself at SETUP time
# via tests/live_gate.py (assert_live_available): with the plane vars unset it SKIPS, so the
# default run and CI stay green, but a DEMANDED live run (EPICS_MCP_REQUIRE_LIVE=1) turns a
# missing prerequisite into a LOUD failure instead of a silent skip (S30; previously
# `pytest -m live` in an empty env exited 0 with everything skipped, indistinguishable from a
# fulfilled live run). The demand applies to the SELECTED set: scope a partial live run with
# `-m live -k <plane>`; data-dependent skips INSIDE a running probe stay skips. Deliberately NO
# `addopts = -m "not live"` (would change default pytest for everyone and is brittle).
markers = [
    "live: needs a running local EPICS stack; opt-in via -m live + the plane's EPICS_MCP_* vars; EPICS_MCP_REQUIRE_LIVE=1 turns a missing prerequisite into a loud failure",
]
