[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epics-pv-mcp"
version = "0.2.0"
description = "MCP Server for EPICS PV access via p4p (PVAccess + Channel Access)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "epicDirk" }]
keywords = ["epics", "mcp", "pvaccess", "channel-access", "p4p", "controls"]
requires-python = ">=3.12"
dependencies = [
    # mcp ist eine DIREKTE Dependency (server.py: mcp.server.fastmcp.FastMCP +
    # mcp.types.ToolAnnotations), nicht nur transitiv über fastmcp.
    "mcp>=1.0,<2",
    "fastmcp>=3.4.2,<4",
    # pydantic>=2.11: Floor der Kern-Deps (fastmcp/pydantic-settings) und des optionalen
    # opi_navigation (s. [displays]); hier explizit zur Intent-Klarheit.
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.0,<3",
    "p4p>=4.2.0,<5",
    # requests: read-only HTTP client for the ESS Naming Service (vendored naming_client).
    "requests>=2.25",
]

[project.optional-dependencies]
# Display-aware tools (validate_pvs / crossplane_check / coverage_audit / find_device) join live PVs
# with the macro-expanded per-instance PV-inventory (Wedge 1) from the opi_navigation build-once PV
# engine (EINE PV-Engine, Build-once EX/EY) — NICHT makro-blind nachgebaut. SHA-gepinnt wie der
# phoebus-MCP (cs-studio-phoebus-mcp); Bump = Pin + `uv lock` (CI fährt `uv sync --frozen`).
# OPTIONAL, damit der Kern-Server (PV-Read/Write/Monitor/Diagnose + REST-Planes) OHNE dieses
# (privat gehostete) Paket standalone installiert; die vier Tools registrieren sich nur, wenn es da
# ist (server.py: try/except ImportError um register_display_tools).
displays = [
    "opi-navigation @ git+https://github.com/epicDirk/opi-foundry.git@8fad86766891aeac177050449f73a3a4fbf554cc",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit>=4.0",
    # NB: `dev` does NOT pull `[displays]`. CI runs `uv sync --extra dev` on the PUBLIC fork, where
    # the private `opi-navigation` git dependency cannot be cloned (the default GITHUB_TOKEN is
    # repo-local) — so CI tests exactly the standalone core a public user gets (conftest.py skips the
    # 6 display test modules when opi_navigation is absent). For the FULL local suite incl. the
    # display-aware tools, use the `all` extra below (`uv sync --extra all`).
]
# Everything for a full local run: the dev toolchain plus the opi_navigation-backed display tools.
all = [
    "epics-pv-mcp[dev,displays]",
]

[project.urls]
Homepage = "https://github.com/epicDirk/EPICS-MCP-Server"
Repository = "https://github.com/epicDirk/EPICS-MCP-Server"
Issues = "https://github.com/epicDirk/EPICS-MCP-Server/issues"
Changelog = "https://github.com/epicDirk/EPICS-MCP-Server/blob/main/CHANGELOG.md"

[project.scripts]
epics-pv-mcp = "epics_pv_mcp.server:main"
epics-crossplane = "epics_pv_mcp.cli_crossplane:main"
epics-coverage = "epics_pv_mcp.cli_coverage:main"
epics-diagnose = "epics_pv_mcp.cli_diagnose:main"
epics-doctor = "epics_pv_mcp.cli_doctor:main"

# Git-Direct-Reference (opi-navigation) erfordert dieses Flag bei hatchling — sonst
# bricht der Metadaten-Build ("Dependency ... cannot be a direct reference"). Spiegelt
# cs-studio-phoebus-mcp.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Regelsatz nach MCP-Parität (phoebus-display-mcp): BLE = blinde except Exception,
# T20 = kein print() (stdout ist der JSON-RPC-Kanal des stdio-Servers).
# Ur-Quelle des Regelsatzes ist QUALITY-STANDARD.md §2 des opi-foundry-Workspace; er kam über
# phoebus-display-mcp hierher. Die Zwischenstufe hatte das Zitat verloren — wer den Satz erbt oder
# ändert, erbt damit auch die Begründung, statt nur eine kopierbare Liste (2026-07-19).
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "PERF", "ANN", "BLE", "T20"]
# Deutsche Typografie in Kommentaren/Docstrings ist Projekt-Konvention — keine
# "ambiguous unicode"-Funde für Gedankenstrich, typografische Anführungszeichen, Apostroph.
allowed-confusables = ["–", "—", "„", "“", "”", "’", "‚", "‘", "×"]

[tool.ruff.lint.per-file-ignores]
# Annotations-Pflicht gilt für src/; in Tests erzwingt mypy --strict die Annotationen,
# ruff lässt sie aus (MCP-Parität).
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# p4p ist untypisiert (keine Stubs). opi_navigation IST getypt (py.typed), aber optional
# ([displays]) und auf dem PUBLIC-Fork-CI abwesend (private git-Dep) — der Override lässt mypy dort
# `import-not-found` schlucken (Symbole werden Any). LOKAL ist es ein No-Op: bei installiertem
# opi_navigation nutzt mypy weiter dessen echte Typen, die Display-Fläche bleibt voll geprüft.
[[tool.mypy.overrides]]
module = [
    "p4p.*",
    "p4p",
    "requests",
    "requests.*",
    "urllib3",
    "urllib3.*",
    "opi_navigation.*",
]
ignore_missing_imports = true

# The display-coupled TEST modules carry `# type: ignore[arg-type]` comments that suppress arg-type
# errors against opi_navigation's REAL types (fully checked when [displays] is installed locally). On
# the public-fork CI opi_navigation is absent → its symbols become Any (override above) → those
# ignores become UNUSED and mypy --strict's warn_unused_ignores would fail the lint job. Relax ONLY
# that one check for ONLY these modules (they are also pytest-skipped without opi_navigation via
# conftest.collect_ignore); every other strict check on them, and all other modules, is unaffected.
[[tool.mypy.overrides]]
module = [
    "tests.test_validate",
    "tests.test_crossplane_tool",
    "tests.test_coverage_tool",
    "tests.test_find_device_tool",
    "tests.test_device_lookup",
    "tests.test_inventory_adapter",
]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
# `live` = tests that need a running local EPICS test stack. Opt-in: set the target plane's
# `EPICS_MCP_*` vars, then `uv run pytest -m live`. Each live module gates itself at SETUP time
# via tests/live_gate.py (assert_live_available): with the plane vars unset it SKIPS, so the
# default run and CI stay green — but a DEMANDED live run (EPICS_MCP_REQUIRE_LIVE=1) turns a
# missing prerequisite into a LOUD failure instead of a silent skip (S30; previously
# `pytest -m live` in an empty env exited 0 with everything skipped — indistinguishable from a
# fulfilled live run). The demand applies to the SELECTED set: scope a partial live run with
# `-m live -k <plane>`; data-dependent skips INSIDE a running probe stay skips. Deliberately NO
# `addopts = -m "not live"` (would change default pytest for everyone and is brittle).
markers = [
    "live: needs a running local EPICS stack; opt-in via -m live + the plane's EPICS_MCP_* vars; EPICS_MCP_REQUIRE_LIVE=1 turns a missing prerequisite into a loud failure",
]
